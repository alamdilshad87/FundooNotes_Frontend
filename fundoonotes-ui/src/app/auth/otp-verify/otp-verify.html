<div class="otp-page">
  <div class="otp-card">
    <img
      src="https://www.gstatic.com/images/branding/googlelogo/1x/googlelogo_color_74x24dp.png"
      alt="Google"
      class="logo"
    />

    <h1>Verify OTP</h1>

    <p class="subtitle">
      OTP sent to <strong>{{ email }}</strong>
    </p>

    <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
      <div class="field float-field">
        <input
          type="text"
          maxlength="6"
          formControlName="otp"
          placeholder=" "
          inputmode="numeric"
          autocomplete="one-time-code"
        />
        <label>Enter OTP</label>
      </div>

      <p class="error" *ngIf="error">
        {{ error }}
      </p>

      <button
        type="submit"
        [disabled]="otpForm.invalid || loading"
      >
        {{ loading ? 'Verifying…' : 'Verify' }}
      </button>
    </form>

    <button
      class="link"
      [disabled]="resendDisabled"
      (click)="resendOtp()"
    >
      Resend OTP
      <span *ngIf="resendDisabled">
        ({{ timer }}s)
      </span>
    </button>
  </div>
</div>
