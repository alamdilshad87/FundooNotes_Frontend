<div class="note-input" [class.expanded]="expanded" (click)="expand()">
  @if (expanded) {
    <input
      class="title"
      type="text"
      placeholder="Title"
      [(ngModel)]="title"
    />
  }

  <textarea
    placeholder="Take a note..."
    [(ngModel)]="content"
  ></textarea>

  @if (expanded) {
    <div class="actions">
      <div class="icons">
        <button>⏰</button>
        <button>🎨</button>
        <button>🖼</button>
        <button>📦</button>
      </div>
      <button class="close" (click)="close()">Close</button>
    </div>
  }
</div>
