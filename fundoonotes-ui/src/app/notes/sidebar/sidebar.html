<aside class="sidebar" [class.collapsed]="collapsed">
  <nav>
    <a class="nav-item" routerLink="/notes" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active">
      <span class="material-icons-outlined icon">lightbulb</span>
      <span class="label">Notes</span>
    </a>

    <a class="nav-item" routerLink="/notes/reminders" routerLinkActive="active">
      <span class="material-icons-outlined icon">notifications</span>
      <span class="label">Reminders</span>
    </a>

    <!-- DYNAMIC LABELS -->
    @for (label of labels; track label.labelId) {
      <a class="nav-item" [routerLink]="['/notes/label', label.labelId]" routerLinkActive="active">
        <span class="material-icons-outlined icon">label</span>
        <span class="label">{{ label.name }}</span>
      </a>
    }

    <!-- EDIT LABELS -->
    <div class="nav-item" (click)="openLabelManager()">
      <span class="material-icons-outlined icon">edit</span>
      <span class="label">Edit labels</span>
    </div>

    <a class="nav-item" routerLink="/notes/archive" routerLinkActive="active">
      <span class="material-icons-outlined icon">archive</span>
      <span class="label">Archive</span>
    </a>

    <a class="nav-item" routerLink="/notes/trash" routerLinkActive="active">
      <span class="material-icons-outlined icon">delete</span>
      <span class="label">Trash</span>
    </a>
  </nav>
</aside>
