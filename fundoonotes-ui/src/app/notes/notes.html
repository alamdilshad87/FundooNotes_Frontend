<div class="notes-layout">
  <app-header
    (toggleSidebar)="toggleSidebar()"
    (search)="onSearch($event)">
  </app-header>

  <div class="content-wrapper">
    <app-sidebar
      [collapsed]="sidebarCollapsed"
      (openLabelManagerRequest)="openLabelManager()">
    </app-sidebar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- ✅ MODAL HERE - NOT IN SIDEBAR -->
@if (showLabelManager) {
  <div class="label-manager-overlay" (click)="closeLabelManager()">
    <div class="label-manager-wrapper" (click)="$event.stopPropagation()">
      <app-label-manager
        (close)="closeLabelManager()"
        (labelCreated)="onLabelCreated()">
      </app-label-manager>
    </div>
  </div>
}
