<header class="keep-header">
  <!-- LEFT SECTION -->
  <div class="left">
    <button class="icon-btn menu-btn" (click)="toggleSidebar.emit()" aria-label="Main menu">
      <span class="material-icons-outlined">menu</span>
    </button>

    <img
      class="logo"
      src="https://www.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png"
      alt="Keep"
    />

    <span class="title">Keep</span>
  </div>

  <!-- CENTER SEARCH -->
  <div class="search-container">
    <div class="search">
      <button class="search-icon" aria-label="Search">
        <span class="material-icons-outlined">search</span>
      </button>

      <input
        type="text"
        placeholder="Search"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        aria-label="Search"
      />

      <button
        class="clear-icon"
        *ngIf="searchQuery"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        <span class="material-icons-outlined">close</span>
      </button>
    </div>
  </div>

  <!-- RIGHT SECTION -->
  <div class="right">
    <button class="icon-btn" aria-label="Refresh">
      <span class="material-icons-outlined">refresh</span>
    </button>

    <button
      class="icon-btn"
      (click)="toggleViewMode()"
      [attr.aria-label]="viewMode === 'grid' ? 'List view' : 'Grid view'">
      <span class="material-icons-outlined">
        {{ viewMode === 'grid' ? 'view_agenda' : 'grid_view' }}
      </span>
    </button>

    <!-- ✅ SETTINGS BUTTON -->
    <button
      class="icon-btn"
      (click)="toggleSettingsDropdown()"
      [class.active]="showSettingsDropdown"
      aria-label="Settings">
      <span class="material-icons-outlined">settings</span>
    </button>

    <button class="icon-btn apps-btn" aria-label="Google apps">
      <span class="material-icons-outlined">apps</span>
    </button>

    <button
      class="avatar"
      (click)="toggleProfileDropdown()"
      [attr.aria-label]="'Google Account: ' + userEmail">
      {{ getInitials() }}
    </button>
  </div>

  <!-- ✅ SETTINGS DROPDOWN -->
  @if (showSettingsDropdown) {
    <app-settings-dropdown (close)="closeSettingsDropdown()"></app-settings-dropdown>
  }

  <!-- ✅ PROFILE DROPDOWN -->
  @if (showProfileDropdown) {
    <app-profile-dropdown (close)="closeProfileDropdown()"></app-profile-dropdown>
  }
</header>
