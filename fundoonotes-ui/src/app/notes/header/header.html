<header class="keep-header">
  <div class="header-left">
    <button class="icon-btn" (click)="toggleSidebar.emit()">
      <span class="material-icons-outlined">menu</span>
    </button>
    <img class="logo" src="https://www.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png" alt="Keep">
    <span class="title">Keep</span>
  </div>

  <div class="header-center">
    <div class="search-box">
      <button class="icon-btn search-btn">
        <span class="material-icons-outlined">search</span>
      </button>
      <input type="text" placeholder="Search">
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn">
      <span class="material-icons-outlined">refresh</span>
    </button>
    <button class="icon-btn">
      <span class="material-icons-outlined">view_agenda</span>
    </button>
    <button class="icon-btn">
      <span class="material-icons-outlined">settings</span>
    </button>
    <button class="icon-btn">
      <span class="material-icons-outlined">apps</span>
    </button>
    <div class="avatar">M</div>
  </div>
</header>
