<div class="settings-dropdown" (click)="$event.stopPropagation()">
  <div class="settings-item">
    <span class="item-text">Settings</span>
  </div>

  <div class="settings-item" (click)="toggleDarkTheme($event)">
    <span class="item-text">{{ isDarkMode ? 'Disable dark theme' : 'Enable dark theme' }}</span>
  </div>

  <div class="settings-item">
    <span class="item-text">Send feedback</span>
  </div>

  <div class="settings-item">
    <span class="item-text">Help</span>
  </div>

  <div class="settings-item">
    <span class="item-text">App downloads</span>
  </div>

  <div class="settings-item">
    <span class="item-text">Keyboard shortcuts</span>
  </div>
</div>
