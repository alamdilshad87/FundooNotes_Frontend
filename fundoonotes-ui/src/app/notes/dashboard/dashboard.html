<div class="dashboard-container">
  <app-take-note (save)="addNote($event)"></app-take-note>

  <!-- ✅ PINNED NOTES SECTION -->
  @if (pinnedNotes.length > 0) {
    <div class="notes-section">
      <div class="section-label">PINNED</div>
      <div class="notes-grid">
        <app-note-card
          *ngFor="let note of pinnedNotes"
          [note]="note"
          [isColorPickerOpen]="openColorPickerNoteId === note.noteId"
          (delete)="deleteNote($event)"
          (archive)="archiveNote($event)"
          (togglePin)="togglePin($event)"
          (noteClick)="openNoteForEdit($event)"
          (updateColor)="updateNoteColor($event)"
          (toggleColorPicker)="handleColorPickerToggle($event)">
        </app-note-card>
      </div>
    </div>
  }

  <!-- ✅ UNPINNED NOTES SECTION -->
  @if (unpinnedNotes.length > 0) {
    <div class="notes-section">
      @if (pinnedNotes.length > 0) {
        <div class="section-label">OTHERS</div>
      }
      <div class="notes-grid">
        <app-note-card
          *ngFor="let note of unpinnedNotes"
          [note]="note"
          [isColorPickerOpen]="openColorPickerNoteId === note.noteId"
          (delete)="deleteNote($event)"
          (archive)="archiveNote($event)"
          (togglePin)="togglePin($event)"
          (noteClick)="openNoteForEdit($event)"
          (updateColor)="updateNoteColor($event)"
          (toggleColorPicker)="handleColorPickerToggle($event)">
        </app-note-card>
      </div>
    </div>
  }

  <!-- ✅ EMPTY STATE -->
  @if (pinnedNotes.length === 0 && unpinnedNotes.length === 0 && !isLoading) {
    <div class="empty-state">
      <span class="material-icons-outlined lightbulb-icon" style="font-size: 120px;">
        lightbulb
      </span>
      <p class="empty-text">Notes you add appear here</p>
    </div>
  }

  <!-- ✅ LOADING STATE -->
  @if (isLoading) {
    <div class="loading">
      <p>Loading notes...</p>
    </div>
  }

  <!-- Edit Modal -->
  @if (selectedNote) {
    <app-edit-note-modal
      [note]="selectedNote"
      (save)="updateNote($event)"
      (close)="closeEditModal()">
    </app-edit-note-modal>
  }
</div>
