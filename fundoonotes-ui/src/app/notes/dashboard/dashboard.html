<div class="dashboard-container">
  <app-take-note (save)="addNote($event)"></app-take-note>

  @if (notes.length > 0) {
    <div class="notes-grid">
      <app-note-card
        *ngFor="let note of notes"
        [note]="note"
        [isColorPickerOpen]="openColorPickerNoteId === note.noteId"
        (delete)="deleteNote($event)"
        (noteClick)="openNoteForEdit($event)"
        (updateColor)="updateNoteColor($event)"
        (toggleColorPicker)="handleColorPickerToggle($event)">
      </app-note-card>
    </div>
  }

  @if (notes.length === 0 && !isLoading) {
    <div class="no-notes">
      <p>No notes yet. Create your first note!</p>
    </div>
  }

  @if (isLoading) {
    <div class="loading">
      <p>Loading notes...</p>
    </div>
  }

  <!-- Edit Modal -->
  @if (selectedNote) {
    <app-edit-note-modal
      [note]="selectedNote"
      (save)="updateNote($event)"
      (close)="closeEditModal()">
    </app-edit-note-modal>
  }
</div>
