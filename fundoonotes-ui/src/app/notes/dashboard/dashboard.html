<app-note-input (create)="addNote($event)"></app-note-input>

<!-- EMPTY STATE -->
<div class="empty-state" *ngIf="notes.length === 0">
  <img
    src="https://www.gstatic.com/images/icons/material/system_gm/1x/lightbulb_outline_black_48dp.png"
    alt="Empty"
  />
  <p>Notes you add appear here</p>
</div>

<!-- NOTES GRID -->
<div class="notes-grid" *ngIf="notes.length > 0">
  <app-note-card
    *ngFor="let note of notes"
    [note]="note">
  </app-note-card>
</div>
