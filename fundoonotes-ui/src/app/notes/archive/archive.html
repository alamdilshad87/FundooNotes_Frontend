<div class="archive-container">
  <div class="archive-header">
    <h2>Archive</h2>
  </div>

  @if (isLoading) {
    <div class="loading">
      <p>Loading archived notes...</p>
    </div>
  }

  @if (!isLoading && archivedNotes.length === 0) {
    <div class="empty-archive">
      <span class="material-icons-outlined empty-icon">archive</span>
      <p>No archived notes</p>
    </div>
  }

  @if (!isLoading && archivedNotes.length > 0) {
    <div class="notes-grid">
      @for (note of archivedNotes; track note.noteId) {
        <div class="archive-note-card" [style.background-color]="note.color === 'transparent' ? '#fff' : note.color">
          <div class="note-content-area">
            @if (note.title) {
              <h3 class="note-title">{{note.title}}</h3>
            }
            <p class="note-content" [innerHTML]="note.content"></p>
          </div>

          <div class="archive-actions">
            <button class="action-btn" (click)="unarchiveNote(note.noteId)" title="Unarchive">
              <span class="material-icons-outlined">unarchive</span>
            </button>
            <button class="action-btn" (click)="deleteNote(note.noteId)" title="Delete">
              <span class="material-icons-outlined">delete</span>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
