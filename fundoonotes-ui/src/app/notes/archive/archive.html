<div class="archive-container">
  <h2 class="page-title">Archive</h2>

  @if (notes.length > 0) {
    <div class="notes-grid" [class.list-view]="viewMode === 'list'">
      <app-note-card
        *ngFor="let note of notes"
        [note]="note"
        [isColorPickerOpen]="openColorPickerNoteId === note.noteId"
        (archive)="unarchiveNote($event)"
        (delete)="deleteNote($event)"
        (togglePin)="togglePin($event)"
        (noteClick)="openNoteForEdit($event)"
        (updateColor)="updateNoteColor($event)"
        (toggleColorPicker)="handleColorPickerToggle($event)">
      </app-note-card>
    </div>
  }

  @if (notes.length === 0 && !isLoading) {
    <div class="empty-state">
      <span class="material-icons-outlined" style="font-size: 120px;">
        archive
      </span>
      <p>Your archived notes appear here</p>
    </div>
  }

  @if (isLoading) {
    <div class="loading">
      <p>Loading archived notes...</p>
    </div>
  }

  <!-- Edit Modal -->
  @if (selectedNote) {
    <app-edit-note-modal
      [note]="selectedNote"
      (save)="updateNote($event)"
      (close)="closeEditModal()">
    </app-edit-note-modal>
  }
</div>
