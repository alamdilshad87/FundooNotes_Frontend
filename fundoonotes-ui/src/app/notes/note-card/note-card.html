<div class="note-card" [ngStyle]="getBackgroundStyle()" (click)="onNoteClick()">
  @if (note.title) {
    <div class="card-header">
      <h3 class="card-title">{{ note.title }}</h3>
      <!-- PIN BUTTON with filled icon when pinned -->
      <button
        class="pin-btn"
        [class.pinned]="note.isPinned"
        (click)="onTogglePin($event)"
        [title]="note.isPinned ? 'Unpin note' : 'Pin note'">
        <span [class]="note.isPinned ? 'material-icons' : 'material-icons-outlined'">
          push_pin
        </span>
      </button>
    </div>
  }

  <p class="card-content">{{ note.content }}</p>

  <!-- Labels display -->
  <div class="note-labels" *ngIf="note.labels && note.labels.length > 0">
    <span class="label-chip" *ngFor="let label of note.labels">
      {{ label }}
    </span>
  </div>

  <div class="card-actions" (click)="$event.stopPropagation()">
    <button class="card-action-btn" title="Remind me">
      <span class="material-icons-outlined">add_alert</span>
    </button>
    <button class="card-action-btn" title="Collaborator">
      <span class="material-icons-outlined">person_add</span>
    </button>
    <button
      class="card-action-btn"
      [class.active]="isColorPickerOpen"
      (click)="onToggleColorPicker($event)"
      title="Background options">
      <span class="material-icons-outlined">palette</span>
    </button>
    <button class="card-action-btn" title="Add image">
      <span class="material-icons-outlined">image</span>
    </button>

    <!-- Label selector -->
    <app-label-selector
      [noteId]="note.noteId"
      [currentLabels]="note.labels"
      (labelsChanged)="onLabelsChanged()">
    </app-label-selector>

    <button class="card-action-btn" (click)="onArchive($event)" title="Archive">
      <span class="material-icons-outlined">archive</span>
    </button>
    <button class="card-action-btn" (click)="onDelete($event)" title="Delete">
      <span class="material-icons-outlined">delete</span>
    </button>
  </div>

  @if (isColorPickerOpen) {
    <div class="color-picker-popup" (click)="$event.stopPropagation()">
      <div class="color-row">
        @for (color of solidColors; track color.value) {
          <button
            class="color-option"
            [class.selected]="this.note.color === color.value"
            [style.background-color]="color.value"
            [class.default-color]="color.value === 'transparent'"
            [title]="color.name"
            (click)="selectColor(color.value, $event)"
            type="button">
            @if (this.note.color === color.value) {
              <span class="material-icons-outlined checkmark">check</span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
