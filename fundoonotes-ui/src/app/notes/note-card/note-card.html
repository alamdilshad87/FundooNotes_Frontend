<div class="note-card" [ngStyle]="getBackgroundStyle()" (click)="onNoteClick()">
  @if (note.title) {
    <div class="card-header">
      <h3 class="card-title" [innerHTML]="note.title"></h3>
      <button class="pin-btn" (click)="$event.stopPropagation()">
        <span class="material-icons-outlined">push_pin</span>
      </button>
    </div>
  }

  <p class="card-content" [innerHTML]="note.content"></p>

  <div class="card-actions" (click)="$event.stopPropagation()">
    <button class="card-action-btn" title="Remind me">
      <span class="material-icons-outlined">add_alert</span>
    </button>
    <button class="card-action-btn" title="Collaborator">
      <span class="material-icons-outlined">person_add</span>
    </button>
    <button class="card-action-btn" title="Background options">
      <span class="material-icons-outlined">palette</span>
    </button>
    <button class="card-action-btn" title="Add image">
      <span class="material-icons-outlined">image</span>
    </button>
    <button class="card-action-btn" title="Archive">
      <span class="material-icons-outlined">archive</span>
    </button>
    <button class="card-action-btn" (click)="onDelete($event)" title="Delete">
      <span class="material-icons-outlined">delete</span>
    </button>
  </div>
</div>
