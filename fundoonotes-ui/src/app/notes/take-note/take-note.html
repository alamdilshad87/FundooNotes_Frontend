<div class="take-note-container">
  @if (!isExpanded) {
    <div class="collapsed-input" (click)="expand()">
      <span class="placeholder">Take a note...</span>
      <div class="collapsed-icons">
        <button class="icon-btn" title="New list" type="button">
          <span class="material-icons-outlined">check_box</span>
        </button>
        <button class="icon-btn" title="New note with image" type="button">
          <span class="material-icons-outlined">image</span>
        </button>
      </div>
    </div>
  }

  @if (isExpanded) {
    <div class="note-input-container" #noteContainer>
      <div class="note-input">
        <div
          #titleEditor
          class="note-title-input"
          contenteditable="true"
          (input)="onTitleInput($event)"
          (mouseup)="updateFormattingStates()"
          (keyup)="updateFormattingStates()"
          placeholder="Title"
          role="textbox"
          aria-label="Title"
        ></div>
        
        <div
          #contentEditor
          class="note-content-input"
          contenteditable="true"
          (input)="onContentInput($event)"
          (mouseup)="updateFormattingStates()"
          (keyup)="updateFormattingStates()"
          placeholder="Take a note..."
          role="textbox"
          aria-label="Note content"
        ></div>
      </div>

      @if (showFormattingToolbar) {
        <div class="formatting-toolbar">
          <button 
            class="format-btn" 
            [class.active]="isBold"
            (click)="formatText('bold')"
            title="Bold"
            type="button">
            <span class="material-icons-outlined">format_bold</span>
          </button>
          <button 
            class="format-btn" 
            [class.active]="isItalic"
            (click)="formatText('italic')"
            title="Italic"
            type="button">
            <span class="material-icons-outlined">format_italic</span>
          </button>
          <button 
            class="format-btn" 
            [class.active]="isUnderline"
            (click)="formatText('underline')"
            title="Underline"
            type="button">
            <span class="material-icons-outlined">format_underlined</span>
          </button>
          <button 
            class="format-btn" 
            [class.active]="isStrikethrough"
            (click)="formatText('strikeThrough')"
            title="Strikethrough"
            type="button">
            <span class="material-icons-outlined">strikethrough_s</span>
          </button>

          <div class="toolbar-divider"></div>

          <button 
            class="format-btn" 
            (click)="formatText('insertUnorderedList')"
            title="Bulleted list"
            type="button">
            <span class="material-icons-outlined">format_list_bulleted</span>
          </button>
          <button 
            class="format-btn" 
            (click)="formatText('insertOrderedList')"
            title="Numbered list"
            type="button">
            <span class="material-icons-outlined">format_list_numbered</span>
          </button>
        </div>
      }

      <div class="note-actions">
        <button 
          class="action-btn" 
          [class.active]="showFormattingToolbar"
          (click)="toggleFormattingToolbar()" 
          title="Text formatting options"
          type="button">
          <span class="material-icons-outlined">text_format</span>
        </button>
        <button class="action-btn" title="Remind me" type="button">
          <span class="material-icons-outlined">add_alert</span>
        </button>
        <button class="action-btn" title="Collaborator" type="button">
          <span class="material-icons-outlined">person_add</span>
        </button>
        <button class="action-btn" title="Background options" type="button">
          <span class="material-icons-outlined">palette</span>
        </button>
        <button class="action-btn" title="Add image" type="button">
          <span class="material-icons-outlined">image</span>
        </button>
        <button class="action-btn" title="Archive" type="button">
          <span class="material-icons-outlined">archive</span>
        </button>
        <button class="action-btn" title="More" type="button">
          <span class="material-icons-outlined">more_vert</span>
        </button>
        
        <button class="close-btn" (click)="close()" type="button">
          Close
        </button>
      </div>
    </div>
  }
</div>
