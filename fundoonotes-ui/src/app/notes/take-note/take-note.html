<div class="take-note-wrapper">
  <div class="take-note" [class.expanded]="isExpanded">
    <!-- COLLAPSED STATE - Simple input with icons -->
    <div class="collapsed-view" *ngIf="!isExpanded" (click)="expand()">
      <span class="placeholder">Take a note...</span>
      <div class="quick-actions">
        <button class="icon-btn" aria-label="New list with checkboxes">
          <span class="material-icons-outlined">check_box</span>
        </button>
        <button class="icon-btn" aria-label="New note with drawing">
          <span class="material-icons-outlined">brush</span>
        </button>
        <button class="icon-btn" aria-label="New note with image">
          <span class="material-icons-outlined">image</span>
        </button>
      </div>
    </div>

    <!-- EXPANDED STATE - Full form -->
    <div class="expanded-view" *ngIf="isExpanded">
      <div class="note-header">
        <input 
          type="text" 
          placeholder="Title" 
          [(ngModel)]="title"
          class="title-input"
        />
        <button class="icon-btn pin-btn" aria-label="Pin note">
          <span class="material-icons-outlined">push_pin</span>
        </button>
      </div>

      <textarea 
        placeholder="Take a note..."
        [(ngModel)]="content"
        class="content-input"
        rows="3"
        autofocus
      ></textarea>

      <div class="note-footer">
        <div class="toolbar">
          <button class="icon-btn" aria-label="Remind me">
            <span class="material-icons-outlined">add_alert</span>
          </button>
          <button class="icon-btn" aria-label="Collaborator">
            <span class="material-icons-outlined">person_add</span>
          </button>
          <button class="icon-btn" aria-label="Background options">
            <span class="material-icons-outlined">palette</span>
          </button>
          <button class="icon-btn" aria-label="Add image">
            <span class="material-icons-outlined">image</span>
          </button>
          <button class="icon-btn" aria-label="Archive">
            <span class="material-icons-outlined">archive</span>
          </button>
          <button class="icon-btn" aria-label="More">
            <span class="material-icons-outlined">more_vert</span>
          </button>
          <button class="icon-btn" aria-label="Undo">
            <span class="material-icons-outlined">undo</span>
          </button>
          <button class="icon-btn" aria-label="Redo">
            <span class="material-icons-outlined">redo</span>
          </button>
        </div>
        <button class="close-btn" (click)="close()">Close</button>
      </div>
    </div>
  </div>
</div>
