<div class="label-manager">
  <div class="header">
    <h3>Edit labels</h3>
  </div>

  <!-- ✅ Create new label - Always visible at top -->
  <div class="create-label-row">
    <button class="icon-btn cancel-btn" type="button" (click)="clearNewLabel()">
      <span class="material-icons-outlined">close</span>
    </button>
    <input
      type="text"
      [(ngModel)]="newLabelName"
      placeholder="Create new label"
      (keyup.enter)="createLabel()"
      class="label-input"
    />
    <button class="icon-btn check-btn" (click)="createLabel()" type="button">
      <span class="material-icons-outlined">check</span>
    </button>
  </div>

  <!-- ✅ Label list -->
  <div class="labels-list">
    <div class="label-row" *ngFor="let label of labels">
      <button class="icon-btn delete-btn" (click)="deleteLabel(label.labelId)" type="button">
        <span class="material-icons-outlined">delete</span>
      </button>

      <span class="label-icon material-icons-outlined">label</span>

      <input
        *ngIf="editingLabel?.labelId === label.labelId"
        type="text"
        [(ngModel)]="editLabelName"
        (keyup.enter)="updateLabel()"
        (keyup.escape)="cancelEdit()"
        (blur)="updateLabel()"
        class="label-input edit-mode"
        autofocus
      />
      <span class="label-text" *ngIf="editingLabel?.labelId !== label.labelId">
        {{ label.name }}
      </span>

      <button
        class="icon-btn edit-btn"
        (click)="editingLabel?.labelId === label.labelId ? updateLabel() : startEdit(label)"
        type="button">
        <span class="material-icons-outlined">edit</span>
      </button>
    </div>

    <div class="empty-state" *ngIf="labels.length === 0">
      <p>No labels created yet</p>
    </div>
  </div>

  <div class="footer">
    <button class="done-btn" (click)="closeModal()" type="button">Done</button>
  </div>
</div>
