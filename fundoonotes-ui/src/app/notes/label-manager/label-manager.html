<div class="label-manager">
  <div class="header">
    <h3>Edit labels</h3>
    <button class="close-btn" (click)="toggleInput()">
      <span class="material-icons-outlined">close</span>
    </button>
  </div>

  <!-- Create new label -->
  <div class="create-label">
    <button class="add-label-btn" (click)="showInput = true" *ngIf="!showInput">
      <span class="material-icons-outlined">add</span>
      <span>Create new label</span>
    </button>

    <div class="label-input-row" *ngIf="showInput">
      <span class="material-icons-outlined">label</span>
      <input
        type="text"
        [(ngModel)]="newLabelName"
        placeholder="Label name"
        (keyup.enter)="createLabel()"
        (keyup.escape)="showInput = false"
      />
      <button (click)="createLabel()">
        <span class="material-icons-outlined">check</span>
      </button>
      <button (click)="showInput = false">
        <span class="material-icons-outlined">close</span>
      </button>
    </div>
  </div>

  <!-- Label list -->
  <div class="labels-list">
    <div class="label-item" *ngFor="let label of labels">
      <span class="material-icons-outlined">label</span>

      <input
        *ngIf="editingLabel?.labelId === label.labelId"
        type="text"
        [(ngModel)]="editLabelName"
        (keyup.enter)="updateLabel()"
        (keyup.escape)="cancelEdit()"
        class="edit-input"
      />
      <span *ngIf="editingLabel?.labelId !== label.labelId">{{ label.name }}</span>

      <div class="actions">
        <button
          *ngIf="editingLabel?.labelId === label.labelId"
          (click)="updateLabel()"
        >
          <span class="material-icons-outlined">check</span>
        </button>
        <button
          *ngIf="editingLabel?.labelId === label.labelId"
          (click)="cancelEdit()"
        >
          <span class="material-icons-outlined">close</span>
        </button>

        <button
          *ngIf="editingLabel?.labelId !== label.labelId"
          (click)="startEdit(label)"
        >
          <span class="material-icons-outlined">edit</span>
        </button>
        <button
          *ngIf="editingLabel?.labelId !== label.labelId"
          (click)="deleteLabel(label.labelId)"
        >
          <span class="material-icons-outlined">delete</span>
        </button>
      </div>
    </div>
  </div>
</div>
